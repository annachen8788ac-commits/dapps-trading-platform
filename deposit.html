<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deposit | DApps Platform</title><link rel="icon" type="image/png" sizes="64x64" href="favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/wallet.css?v=20260926-11"><link rel="stylesheet" href="assets/css/utility-ui.css?v=20260926-11"><style>
.quick-list{display:flex;flex-direction:column;gap:12px;margin-top:8px}.quick-item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:18px 16px;border:1px solid rgba(148,163,184,.18);border-radius:12px;background:rgba(255,255,255,.035);color:inherit;text-align:left;cursor:pointer}.quick-item:hover{border-color:rgba(148,163,184,.35);background:rgba(255,255,255,.055)}.quick-left{display:flex;align-items:center;gap:14px}.coin-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:13px;font-weight:800;letter-spacing:-.3px}.quick-name{font-size:16px;font-weight:700}.quick-arrow{font-size:28px;line-height:1;color:#9aa4b2}.deposit-detail{display:none}.deposit-detail.active{display:block}.quick-home.hidden{display:none}.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.detail-back{border:0;background:transparent;color:inherit;font-size:24px;cursor:pointer;padding:0 4px 0 0}.detail-title{font-size:18px;font-weight:800}.qr-wrap{display:flex;justify-content:center;padding:10px 0 20px}.qr-wrap img{width:220px;height:220px;max-width:72vw;background:#fff;padding:10px;border-radius:12px}.address-label{font-size:13px;color:#9aa4b2;margin-bottom:8px}.address-box.quick-address{align-items:center}.address-box.quick-address .address{word-break:break-all}.detail-note{text-align:center;margin-top:12px}.deposit-form{margin-top:22px}
</style></head><body class="platform-ui"><div class="shell"><header class="top"><a href="index.html#assets">← Assets</a><span class="brand brand-real-logo"><img class="brand-real-logo-img" src="assets/img/dp-logo-header.png?v=20260925-4" alt="DApps Platform"><span>DApps Platform</span></span><a href="profile.html">Account</a></header><main class="content"><span class="eyebrow">WALLET</span><h1 class="title">Deposit</h1><p class="lead">Choose a deposit asset, then scan the QR code or copy the address.</p><div class="tabs"><a class="active" href="deposit.html">Deposit</a><a href="withdraw.html">Withdraw</a></div><div id="walletCard" class="card balance"><div><span>Available Balance</span><strong id="balance">—</strong></div><span id="balanceAsset">USDT</span></div>

<section id="quickHome" class="card quick-home"><strong>Quick Deposit</strong><div id="quickList" class="quick-list"><div class="empty">Loading…</div></div></section>

<section id="depositDetail" class="card deposit-detail">
  <div class="detail-head"><button id="detailBack" class="detail-back" type="button">←</button><div id="detailTitle" class="detail-title">Deposit</div></div>
  <div class="qr-wrap"><img id="qrImage" alt="Deposit address QR code"></div>
  <div class="address-label">Deposit Address</div>
  <div class="address-box quick-address"><div id="address" class="address">—</div><button id="copyBtn" class="copy" type="button">Copy</button></div>
  <div id="networkNote" class="network-note detail-note"></div>
  <div class="deposit-form">
    <div class="field"><label>Amount</label><input id="amount" type="number" min="0" step="0.01" placeholder="Enter amount"><div id="minimum" class="hint" style="margin-top:6px"></div></div>
    <div class="field"><label>Transaction Reference / TXID <span class="muted">(optional)</span></label><input id="txReference" maxlength="160" placeholder="Paste transaction reference if available"></div>
    <div class="field"><label>Transfer Screenshot</label><label class="upload" for="proof"><input id="proof" type="file" accept="image/png,image/jpeg,image/webp"><b>Upload transfer screenshot</b><span class="hint">PNG, JPG or WEBP · up to 5 MB</span></label><img id="preview" class="preview" alt="Transfer proof preview"></div>
    <button id="submit" class="submit" disabled>Submit Deposit</button><div id="msg" class="notice"></div>
  </div>
</section>

<section class="card"><div class="row-top"><strong>Deposit History</strong><a href="#" id="refresh" class="muted">Refresh</a></div><div id="history" class="rows"><div class="empty">Loading…</div></div></section></main></div><script src="assets/js/user-notifications.js?v=20260926-11"></script><script>
const API=localStorage.getItem('dapps:apiBase')||'https://dapps-trading-platform-production.up.railway.app';
const token=localStorage.getItem('dapps:token');if(!token)location.href='login.html';
const $=s=>document.querySelector(s);
let quickOptions=[],assetRows=[],proofDataUrl='',kycApproved=false,selectedQuick=null;
const digits=a=>a==='BTC'?8:a==='ETH'?6:6;
const fmt=(n,a='USDT')=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:digits(a)});
function show(t,e=false){const m=$('#msg');m.textContent=t;m.className='notice '+(e?'err':'ok')}
async function api(path,opt={}){const method=String(opt.method||'GET').toUpperCase();const r=await fetch(API+path,{...opt,cache:method==='GET'?'no-store':opt.cache,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('dapps:token');location.href='login.html';throw new Error('Session expired')}if(!r.ok)throw new Error(d.error||'Request failed');return d}
function assetBalance(asset){return assetRows.find(x=>x.asset===asset)?.available||0}
function updateBalance(asset='USDT'){$('#balance').textContent=fmt(assetBalance(asset),asset);$('#balanceAsset').textContent=asset}
function iconText(x){if(x.asset==='USDT')return '₮';if(x.asset==='BTC')return '₿';if(x.asset==='ETH')return 'Ξ';if(x.asset==='USDC')return '$';return x.asset.slice(0,2)}
function renderQuickList(){
  $('#quickList').innerHTML=quickOptions.map((x,i)=>`<button class="quick-item" type="button" data-i="${i}" ${x.enabled?'':'disabled'}><span class="quick-left"><span class="coin-icon">${iconText(x)}</span><span class="quick-name">${x.label}${x.enabled?'':' · Unavailable'}</span></span><span class="quick-arrow">›</span></button>`).join('')||'<div class="empty">No deposit options available.</div>';
  document.querySelectorAll('.quick-item').forEach(b=>b.onclick=()=>openDetail(Number(b.dataset.i)));
}
function openDetail(i){
  const x=quickOptions[i];if(!x||!x.enabled||!x.address)return;
  selectedQuick=x;proofDataUrl='';$('#proof').value='';$('#preview').style.display='none';$('#amount').value='';$('#txReference').value='';show('');
  $('#detailTitle').textContent=x.label;
  $('#address').textContent=x.address;
  $('#minimum').textContent=`Minimum: ${fmt(x.minimumAmount,x.asset)} ${x.asset}`;
  $('#networkNote').textContent=`Only send ${x.asset} using the ${x.network} network.`;
  $('#qrImage').src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(x.address);
  $('#quickHome').classList.add('hidden');$('#depositDetail').classList.add('active');updateBalance(x.asset);renderSubmit();
}
function closeDetail(){selectedQuick=null;$('#depositDetail').classList.remove('active');$('#quickHome').classList.remove('hidden');updateBalance('USDT')}
function renderSubmit(){$('#submit').disabled=!kycApproved||!selectedQuick||!proofDataUrl}
async function load(){
  try{
    const [w,a,k]=await Promise.all([api('/api/wallet'),api('/api/assets'),api('/api/kyc')]);
    assetRows=a.assets||[];renderHistory(w.deposits||[]);kycApproved=k.kyc?.status==='approved';quickOptions=[];
    if(kycApproved){const q=await api('/api/deposit/quick-options');quickOptions=(q.options||[]).sort((x,y)=>(x.sortOrder||0)-(y.sortOrder||0))}
    renderQuickList();updateBalance(selectedQuick?.asset||'USDT');renderSubmit();
    if(!kycApproved){$('#quickList').innerHTML='<div class="empty">Complete identity verification before depositing.</div>'}
  }catch(e){$('#quickList').innerHTML='<div class="empty">'+e.message+'</div>';show(e.message,true)}
}
function renderHistory(rows){$('#history').innerHTML=rows.length?rows.map(x=>`<div class="row"><div class="row-top"><strong>${x.request_no}</strong><span class="status ${x.status}">${x.status}</span></div><div class="muted" style="margin-top:6px">${x.network} · ${fmt(x.amount,x.asset)} ${x.asset} · ${new Date(x.created_at).toLocaleString('en-US',{timeZone:'America/New_York',timeZoneName:'short'})}</div></div>`).join(''):'<div class="empty">No deposit records yet.</div>';rows.filter(x=>x.reviewed_at&&['approved','rejected'].includes(x.status)).forEach(x=>window.userMarkNotification?.('deposit',x.request_no,x.reviewed_at))}
$('#detailBack').onclick=closeDetail;
$('#copyBtn').onclick=async()=>{const c=selectedQuick,btn=$('#copyBtn');if(!c)return;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(c.address)}else{const t=document.createElement('textarea');t.value=c.address;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();if(!document.execCommand('copy'))throw new Error('copy failed');t.remove()}const old=btn.textContent;btn.textContent='Copied ✓';show('Deposit address copied successfully.');setTimeout(()=>{btn.textContent=old},1600)}catch{show('Unable to copy the deposit address. Please copy it manually.',true)}};
$('#proof').onchange=async e=>{const f=e.target.files?.[0];proofDataUrl='';if(!f){renderSubmit();return}if(f.size>5*1024*1024){show('Screenshot is larger than 5 MB.',true);e.target.value='';renderSubmit();return}try{proofDataUrl=await compressImage(f);$('#preview').src=proofDataUrl;$('#preview').style.display='block';renderSubmit()}catch{show('Unable to read screenshot.',true)}};
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{let w=img.width,h=img.height,max=1600;if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',.82))};img.src=reader.result};reader.readAsDataURL(file)})}
$('#submit').onclick=async()=>{
  if(!kycApproved)return show('Complete identity verification before depositing.',true);
  const c=selectedQuick,amount=Number($('#amount').value),file=$('#proof').files?.[0];
  if(!c||!proofDataUrl)return show('Choose a deposit option and upload a screenshot.',true);
  if(!amount||amount<Number(c.minimumAmount))return show(`Minimum deposit is ${fmt(c.minimumAmount,c.asset)} ${c.asset}.`,true);
  $('#submit').disabled=true;$('#submit').textContent='Submitting…';
  try{const d=await api('/api/deposits',{method:'POST',body:JSON.stringify({asset:c.asset,network:c.network,amount,txReference:$('#txReference').value.trim(),proofDataUrl,proofFilename:file?.name||'proof.jpg'})});show(`Deposit ${d.deposit.requestNo} submitted for review.`);$('#amount').value='';$('#txReference').value='';$('#proof').value='';proofDataUrl='';$('#preview').style.display='none';await load()}
  catch(e){show(e.message,true)}finally{$('#submit').textContent='Submit Deposit';renderSubmit()}
};
$('#refresh').onclick=e=>{e.preventDefault();load()};
load();
</script><script src="assets/js/escape-back.js?v=20260926-11"></script></body></html>
