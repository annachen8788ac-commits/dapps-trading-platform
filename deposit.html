<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deposit | DApps Platform</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="wallet.css"></head><body><div class="shell"><header class="top"><a href="index.html#assets">← Assets</a><span class="brand">DApps Platform</span><a href="profile.html">Account</a></header><main class="content"><span class="eyebrow">WALLET</span><h1 class="title">Deposit</h1><p class="lead">Select a network, send to the displayed address, then submit your transfer details for review.</p><div class="tabs"><a class="active" href="deposit.html">Deposit</a><a href="withdraw.html">Withdraw</a></div><div id="walletCard" class="card balance"><div><span>Available Balance</span><strong id="balance">—</strong></div><span>USDT</span></div><section class="card"><div class="field"><label>Asset</label><select id="asset"><option>USDT</option></select></div><div class="field"><label>Network</label><select id="network"><option value="">Loading…</option></select></div><div class="field"><label>Deposit Address</label><div class="address-box"><div id="address" class="address">Select a network</div><button id="copyBtn" class="copy" type="button">Copy</button></div><div id="networkNote" class="network-note">Only send the selected asset using the selected network.</div></div><div class="field"><label>Amount</label><input id="amount" type="number" min="0" step="0.01" placeholder="Enter amount"><div id="minimum" class="hint" style="margin-top:6px"></div></div><div class="field"><label>Transaction Reference / TXID <span class="muted">(optional)</span></label><input id="txReference" maxlength="160" placeholder="Paste transaction reference if available"></div><div class="field"><label>Transfer Screenshot</label><label class="upload" for="proof"><input id="proof" type="file" accept="image/png,image/jpeg,image/webp"><b>Upload transfer screenshot</b><span class="hint">PNG, JPG or WEBP · up to 5 MB</span></label><img id="preview" class="preview" alt="Transfer proof preview"></div><button id="submit" class="submit" disabled>Submit Deposit</button><div id="msg" class="notice"></div></section><section class="card"><div class="row-top"><strong>Deposit History</strong><a href="#" id="refresh" class="muted">Refresh</a></div><div id="history" class="rows"><div class="empty">Loading…</div></div></section></main></div><script>
const API=localStorage.getItem('dapps:apiBase')||'https://dapps-trading-platform-production.up.railway.app';const token=localStorage.getItem('dapps:token');if(!token)location.href='login.html';const $=s=>document.querySelector(s);let channels=[],proofDataUrl='';const money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});function show(t,e=false){const m=$('#msg');m.textContent=t;m.className='notice '+(e?'err':'ok')}async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('dapps:token');location.href='login.html';throw new Error('Session expired')}if(!r.ok)throw new Error(d.error||'Request failed');return d}function selected(){return channels.find(x=>x.network===$('#network').value)}function renderChannel(){const c=selected();$('#address').textContent=c?.address||'Select a network';$('#minimum').textContent=c?`Minimum: ${money(c.minimumAmount)} ${c.asset}`:'';$('#submit').disabled=!c||!proofDataUrl}async function load(){try{const [w,c]=await Promise.all([api('/api/wallet'),api('/api/deposit/channels')]);$('#balance').textContent=money(w.balance.available);channels=c.channels||[];$('#network').innerHTML=channels.length?channels.map(x=>`<option value="${x.network}">${x.network}</option>`).join(''):'<option value="">Unavailable</option>';renderChannel();renderHistory(w.deposits||[])}catch(e){show(e.message,true)}}function renderHistory(rows){$('#history').innerHTML=rows.length?rows.map(x=>`<div class="row"><div class="row-top"><strong>${x.request_no}</strong><span class="status ${x.status}">${x.status}</span></div><div class="muted" style="margin-top:6px">${x.network} · ${money(x.amount)} ${x.asset} · ${new Date(x.created_at).toLocaleString()}</div>${x.review_note?`<div class="muted" style="margin-top:5px">${x.review_note}</div>`:''}</div>`).join(''):'<div class="empty">No deposit records yet.</div>'}$('#network').onchange=renderChannel;$('#copyBtn').onclick=async()=>{const c=selected();if(!c)return;await navigator.clipboard.writeText(c.address);show('Deposit address copied.')} ;$('#proof').onchange=async e=>{const f=e.target.files?.[0];proofDataUrl='';if(!f){renderChannel();return}if(f.size>5*1024*1024){show('Screenshot is larger than 5 MB.',true);e.target.value='';renderChannel();return}try{proofDataUrl=await compressImage(f);$('#preview').src=proofDataUrl;$('#preview').style.display='block';renderChannel()}catch{show('Unable to read screenshot.',true)}};function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{let w=img.width,h=img.height,max=1600;if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',.82))};img.src=reader.result};reader.readAsDataURL(file)})}$('#submit').onclick=async()=>{const c=selected(),amount=Number($('#amount').value),file=$('#proof').files?.[0];if(!c||!proofDataUrl)return show('Select a network and upload a screenshot.',true);if(!amount||amount<Number(c.minimumAmount))return show(`Minimum deposit is ${money(c.minimumAmount)} ${c.asset}.`,true);$('#submit').disabled=true;$('#submit').textContent='Submitting…';try{const d=await api('/api/deposits',{method:'POST',body:JSON.stringify({asset:c.asset,network:c.network,amount,txReference:$('#txReference').value.trim(),proofDataUrl,proofFilename:file?.name||'proof.jpg'})});show(`Deposit ${d.deposit.requestNo} submitted for review.`);$('#amount').value='';$('#txReference').value='';$('#proof').value='';proofDataUrl='';$('#preview').style.display='none';await load()}catch(e){show(e.message,true)}finally{$('#submit').textContent='Submit Deposit';renderChannel()}};$('#refresh').onclick=e=>{e.preventDefault();load()};load();
</script></body></html>
