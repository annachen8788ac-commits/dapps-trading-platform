<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Recovery | DApps Platform</title><link rel="icon" type="image/png" sizes="64x64" href="favicon.png"><link rel="stylesheet" href="assets/css/account.css"><link rel="stylesheet" href="assets/css/utility-ui.css?v=20260925-1"></head><body class="platform-ui"><div class="shell"><header class="top"><a class="back" href="login.html">← Sign In</a><span class="brand brand-real-logo"><img class="brand-real-logo-img" src="dp-logo-header.png?v=20260925-4" alt="DApps Platform"><span>Account Recovery</span></span><a class="link" href="support.html">Support</a></header><main class="wrap"><section class="card"><span class="eyebrow">ACCOUNT ACCESS</span><h1 class="title">Recover Your Account</h1><p class="muted">Submit a recovery request. Account details are only released after identity verification.</p><div id="msg" class="notice" style="display:none"></div><div class="method-tabs"><button class="method active" data-type="username">Forgot Username</button><button class="method" data-type="password">Forgot Password</button></div><div class="field"><label>Account information you remember</label><input id="lookup" autocomplete="username" placeholder="DP account ID, email, mobile or username"></div><div class="field"><label>Contact information for verification</label><input id="contact" placeholder="Email or mobile number where support can reach you"></div><button id="request" class="btn">Submit Recovery Request</button><hr style="border:0;border-top:1px solid #24304a;margin:24px 0"><h2 style="margin:0 0 8px">Complete Recovery</h2><p class="muted">After support verifies your identity, enter the request number and one-time recovery code provided to you.</p><div class="field"><label>Recovery Request Number</label><input id="requestNo" placeholder="RCV-..."></div><div class="field"><label>Recovery Code</label><input id="recoveryCode" autocomplete="one-time-code" maxlength="8" placeholder="8-character code"></div><div id="passwordFields" style="display:none"><div class="field"><label>New Password</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div><div class="field"><label>Confirm New Password</label><input id="confirmPassword" type="password" autocomplete="new-password"></div></div><button id="complete" class="btn">Complete Recovery</button><div id="result" class="notice" style="display:none"></div></section></main></div><script>
const API=localStorage.getItem('dapps:apiBase')||'https://dapps-trading-platform-production.up.railway.app',q=new URLSearchParams(location.search);let recoveryType=q.get('type')==='password'?'password':'username';const $=s=>document.querySelector(s);function show(t,e=false,id='#msg'){const m=$(id);m.style.display='block';m.className='notice '+(e?'err':'ok');m.textContent=t}function paint(){document.querySelectorAll('.method').forEach(b=>b.classList.toggle('active',b.dataset.type===recoveryType));$('#passwordFields').style.display=recoveryType==='password'?'block':'none'}document.querySelectorAll('.method').forEach(b=>b.onclick=()=>{recoveryType=b.dataset.type;paint()});$('#request').onclick=async()=>{const lookup=$('#lookup').value.trim(),contact=$('#contact').value.trim();if(!lookup||!contact)return show('Enter the account information you remember and contact information.',true);const b=$('#request');b.disabled=true;try{const r=await fetch(API+'/api/auth/recovery/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({recoveryType,lookup,contact})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Unable to submit request');$('#requestNo').value=d.requestNo;show('Recovery request submitted. Request number: '+d.requestNo+'. Keep this number. Support will verify your identity before issuing a one-time recovery code.')}catch(e){show(e.message,true)}finally{b.disabled=false}};$('#complete').onclick=async()=>{const requestNo=$('#requestNo').value.trim(),recoveryCode=$('#recoveryCode').value.trim(),newPassword=$('#newPassword').value,confirmPassword=$('#confirmPassword').value;if(!requestNo||!recoveryCode)return show('Enter your recovery request number and recovery code.',true,'#result');if(recoveryType==='password'){if(newPassword.length<8)return show('New password must be at least 8 characters.',true,'#result');if(newPassword!==confirmPassword)return show('Passwords do not match.',true,'#result')}const b=$('#complete');b.disabled=true;try{const r=await fetch(API+'/api/auth/recovery/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestNo,recoveryCode,newPassword})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Recovery failed');if(d.recoveryType==='username'){show('Your login identifier is: '+d.identifier,false,'#result')}else{localStorage.removeItem('dapps:token');localStorage.removeItem('dapps:user');show(d.message||'Password reset successfully. You can now sign in with your new password.',false,'#result')}}catch(e){show(e.message,true,'#result')}finally{b.disabled=false}};paint();
</script></body></html>
