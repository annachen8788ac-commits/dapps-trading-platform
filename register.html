<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | DApps Platform</title><link rel="stylesheet" href="account.css"></head><body><div class="shell"><header class="top"><a class="back" href="index.html#home">← Back</a><span class="brand">DApps Platform</span><span></span></header><main class="wrap"><section class="card"><span class="eyebrow">NEW ACCOUNT</span><h1 class="title">Register</h1><p class="muted">Register with email or mobile number. Your account ID is created automatically.</p><div id="msg" class="notice" style="display:none"></div><div class="field"><label>Registration Method</label><select id="type"><option value="email">Email</option><option value="mobile">Mobile</option></select></div><div class="field"><label id="identifier-label">Email</label><input id="identifier" autocomplete="username"></div><div class="field"><label>Display Name</label><input id="name" autocomplete="name"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="new-password"></div><div class="field"><label>Confirm Password</label><input id="confirm" type="password" autocomplete="new-password"></div><button id="register" class="btn">Create Account</button><div class="foot">Already registered? <a href="login.html">Sign in</a></div></section></main></div><script>const API=localStorage.getItem('dapps:apiBase')||'http://localhost:3000';const msg=document.querySelector('#msg'),type=document.querySelector('#type');type.onchange=()=>document.querySelector('#identifier-label').textContent=type.value==='email'?'Email':'Mobile Number';function show(t,e=false){msg.style.display='block';msg.className='notice '+(e?'err':'ok');msg.textContent=t}document.querySelector('#register').onclick=async()=>{const p=document.querySelector('#password').value,c=document.querySelector('#confirm').value;if(p!==c)return show('Passwords do not match.',true);try{const r=await fetch(API+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({registrationType:type.value,identifier:document.querySelector('#identifier').value.trim(),displayName:document.querySelector('#name').value.trim(),password:p})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Registration failed');localStorage.setItem('dapps:token',d.token);localStorage.setItem('dapps:user',JSON.stringify(d.user));show('Account created. ID: '+d.user.publicId);setTimeout(()=>location.href='profile.html',700)}catch(e){show(e.message,true)}};</script></body></html>
