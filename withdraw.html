<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdraw | DApps Platform</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="wallet.css"></head><body><div class="shell"><header class="top"><a href="index.html#assets">← Assets</a><span class="brand">DApps Platform</span><a href="profile.html">Account</a></header><main class="content"><span class="eyebrow">WALLET</span><h1 class="title">Withdraw</h1><p class="lead">Enter the destination details and submit a withdrawal request for review.</p><div class="tabs"><a href="deposit.html">Deposit</a><a class="active" href="withdraw.html">Withdraw</a></div><div class="card balance"><div><span>Available Balance</span><strong id="balance">—</strong></div><span>USDT</span></div><section class="card"><div class="field"><label>Asset</label><select id="asset"><option>USDT</option></select></div><div class="field"><label>Network</label><select id="network"><option value="TRC20">TRC20</option><option value="ERC20">ERC20</option></select></div><div class="field"><label>Destination Address</label><input id="address" maxlength="240" placeholder="Enter wallet address"></div><div class="field"><label>Amount</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="Enter amount"><div class="hint" style="margin-top:6px">Submitted amount will be held until the request is reviewed.</div></div><button id="submit" class="submit">Submit Withdrawal</button><div id="msg" class="notice"></div></section><section class="card"><div class="row-top"><strong>Withdrawal History</strong><a href="#" id="refresh" class="muted">Refresh</a></div><div id="history" class="rows"><div class="empty">Loading…</div></div></section></main></div><script>
const API=localStorage.getItem('dapps:apiBase')||'https://dapps-trading-platform-production.up.railway.app';const token=localStorage.getItem('dapps:token');if(!token)location.href='login.html';const $=s=>document.querySelector(s);const money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});function show(t,e=false){const m=$('#msg');m.textContent=t;m.className='notice '+(e?'err':'ok')}async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('dapps:token');location.href='login.html';throw new Error('Session expired')}if(!r.ok)throw new Error(d.error||'Request failed');return d}async function load(){try{const w=await api('/api/wallet');$('#balance').textContent=money(w.balance.available);renderHistory(w.withdrawals||[])}catch(e){show(e.message,true)}}function renderHistory(rows){$('#history').innerHTML=rows.length?rows.map(x=>`<div class="row"><div class="row-top"><strong>${x.request_no}</strong><span class="status ${x.status}">${x.status}</span></div><div class="muted" style="margin-top:6px">${x.network} · ${money(x.amount)} ${x.asset} · ${new Date(x.created_at).toLocaleString()}</div><div class="muted" style="margin-top:5px;word-break:break-all">${x.destination_address}</div>${x.review_note?`<div class="muted" style="margin-top:5px">${x.review_note}</div>`:''}</div>`).join(''):'<div class="empty">No withdrawal records yet.</div>'}$('#submit').onclick=async()=>{const amount=Number($('#amount').value),address=$('#address').value.trim(),network=$('#network').value;if(!address||!amount||amount<=0)return show('Enter a valid address and amount.',true);if(!confirm(`Submit ${money(amount)} USDT withdrawal on ${network}?`))return;$('#submit').disabled=true;$('#submit').textContent='Submitting…';try{const d=await api('/api/withdrawals',{method:'POST',body:JSON.stringify({asset:'USDT',network,address,amount})});show(`Withdrawal ${d.withdrawal.requestNo} submitted for review.`);$('#amount').value='';$('#address').value='';await load()}catch(e){show(e.message,true)}finally{$('#submit').disabled=false;$('#submit').textContent='Submit Withdrawal'}};$('#refresh').onclick=e=>{e.preventDefault();load()};load();
</script></body></html>
