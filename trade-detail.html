<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11131d"><title>Trade Details | DApps Platform</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#0f111a;--panel:#171a26;--line:#2a3042;--text:#f4f7fb;--muted:#8e96aa;--green:#28c77c;--red:#ff5b67;--blue:#4d7cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:980px;margin:0 auto;padding:32px 20px 60px}.back{display:inline-flex;align-items:center;gap:8px;color:#aebcf1;text-decoration:none;margin-bottom:22px}.card{background:linear-gradient(180deg,#1c202f,#141722);border:1px solid var(--line);border-radius:16px;overflow:hidden}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding:22px;border-bottom:1px solid var(--line)}.head h1{margin:5px 0 0;font-size:28px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#6f8cff}.status{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:700}.status.active{background:rgba(77,124,255,.13);color:#9bb2ff}.status.won{background:rgba(40,199,124,.13);color:#69dda4}.status.lost{background:rgba(255,91,103,.13);color:#ff939b}.grid{display:grid;grid-template-columns:repeat(2,1fr)}.item{padding:18px 22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.item:nth-child(even){border-right:0}.item span{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.item strong{font-size:15px}.positive{color:var(--green)}.negative{color:var(--red)}.summary{padding:22px}.summary h2{font-size:16px;margin:0 0 14px}.summary p{color:var(--muted);line-height:1.7;margin:0}.empty{padding:60px 24px;text-align:center;color:var(--muted)}@media(max-width:640px){.wrap{padding:20px 14px 40px}.head{flex-direction:column}.grid{grid-template-columns:1fr}.item,.item:nth-child(even){border-right:0}.head h1{font-size:23px}}</style></head><body><main class="wrap"><a class="back" href="index.html#trade">← Back to Trade</a><section class="card" id="detail-card"><div class="empty">Loading trade details…</div></section></main><script>(()=>{const id=new URLSearchParams(location.search).get('id');const a=JSON.parse(localStorage.getItem('dapps:activeTrades:v2')||'[]');const h=JSON.parse(localStorage.getItem('dapps:tradeHistory:v2')||'[]');const t=[...a,...h].find(x=>String(x.id)===String(id));const card=document.querySelector('#detail-card');const f=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});const time=ts=>ts?new Date(ts).toLocaleString('en-US',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):'—';if(!t){card.innerHTML='<div class="empty">Trade not found.</div>';return}const active=t.status==='active';const result=active?'active':t.result;const statusText=active?'Trading':t.result==='won'?'Won':'Lost';const pnl=active?'—':`${t.profit>=0?'+':''}${f(t.profit)} USDT`;card.innerHTML=`<div class="head"><div><span class="eyebrow">TRADE DETAILS</span><h1>${t.symbol}</h1></div><span class="status ${result}">${statusText}</span></div><div class="grid"><div class="item"><span>Trade ID</span><strong>${t.id}</strong></div><div class="item"><span>Direction</span><strong class="${t.dir==='up'?'positive':'negative'}">${t.dir==='up'?'↑ Up':'↓ Down'}</strong></div><div class="item"><span>Entry Price</span><strong>${f(t.entry, t.entry<1?6:t.entry<100?4:2)}</strong></div><div class="item"><span>Exit Price</span><strong>${active?'—':f(t.exit,t.exit<1?6:t.exit<100?4:2)}</strong></div><div class="item"><span>Amount</span><strong>${f(t.amount)} USDT</strong></div><div class="item"><span>Profit Rate</span><strong>+${t.profitRate}%</strong></div><div class="item"><span>Duration</span><strong>${t.duration}s</strong></div><div class="item"><span>P/L</span><strong class="${!active&&t.profit>=0?'positive':!active?'negative':''}">${pnl}</strong></div><div class="item"><span>Opened At</span><strong>${time(t.openedAt)}</strong></div><div class="item"><span>Closed At</span><strong>${time(t.closedAt)}</strong></div></div><div class="summary"><h2>Execution Summary</h2><p>${active?'This position is currently active. The final result and exit price will be recorded automatically when the selected duration expires.':'This trade is completed and remains stored in Trade History for later review.'}</p></div>`;})();</script></body></html>
