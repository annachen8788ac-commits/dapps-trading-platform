name: Generate dependency lockfiles

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/generate-lockfiles.yml"

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate admin lockfile
        working-directory: admin-panel
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfiles
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- backend/package-lock.json admin-panel/package-lock.json)" ]; then
            echo "Lockfiles already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json admin-panel/package-lock.json
          git commit -m "chore: lock production dependencies"
          git push origin HEAD:main
