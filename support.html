<!doctype html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Support | DApps Platform</title><link rel="icon" type="image/png" sizes="64x64" href="favicon.png"><link rel="stylesheet" href="assets/css/account.css"><style>
body{background:#07101d}
.chat-shell{max-width:820px;margin:auto;padding:16px}
.chat-card{height:calc(100vh - 105px);min-height:560px;background:linear-gradient(180deg,#0d1b2e 0%,#0a1727 100%);border:1px solid #24405e;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 55px rgba(0,0,0,.24)}
.chat-head{padding:17px 18px;border-bottom:1px solid #20364f;display:flex;align-items:center;justify-content:space-between;gap:14px;background:rgba(255,255,255,.012)}
.support-id{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#0a1829;border:1px solid #2b4d70;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);position:relative;flex:0 0 48px}
.avatar img{width:34px;height:34px;object-fit:contain;display:block}
.avatar::after{content:'';position:absolute;right:4px;bottom:4px;width:9px;height:9px;border-radius:50%;background:#51df93;border:2px solid #0d1b2e}
.support-copy{min-width:0}
.support-copy strong{display:block;font-size:15px;line-height:1.25;color:#f4f8ff}
.online{font-size:12px;color:#63dda0;margin-top:3px}
.support-note{font-size:11px;color:#849ab4;margin-top:2px}
.customer{font-size:11px;line-height:1.35;color:#8196af;text-align:right;max-width:42%}
.customer b{display:block;color:#dce8f7;font-size:12px;font-weight:700}
.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.bubble{max-width:min(78%,540px);padding:12px 14px;border-radius:16px;line-height:1.48;font-size:14px;word-break:break-word}
.bubble.agent{align-self:flex-start;background:#17283d;border:1px solid #203853;border-bottom-left-radius:5px;color:#f4f8ff}
.bubble.user{align-self:flex-end;background:linear-gradient(135deg,#147dff,#29bfff);border-bottom-right-radius:5px;color:#fff;box-shadow:0 10px 24px rgba(20,125,255,.16)}
.welcome-title{font-weight:750;font-size:14px;margin-bottom:4px}
.time{font-size:10px;opacity:.62;margin-top:6px}
.composer{border-top:1px solid #20364f;padding:12px;display:flex;align-items:flex-end;gap:9px;background:#0b1828}
.composer textarea{flex:1;resize:none;min-height:52px;max-height:110px;background:#0c1c30;color:#fff;border:1px solid #2a4665;border-radius:13px;padding:13px 14px;line-height:1.45;outline:none;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:14px;font-weight:500;letter-spacing:0}
.composer textarea:focus{border-color:#3d91ff;box-shadow:0 0 0 3px rgba(61,145,255,.1)}
.composer textarea::placeholder{color:#7890aa;font-family:inherit;font-size:14px;font-weight:400;letter-spacing:0}
.send{width:90px;height:52px;border:0;border-radius:13px;background:linear-gradient(135deg,#1482ff,#2cc7ff);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:13px;font-weight:800;letter-spacing:0;cursor:pointer}
.send:disabled{opacity:.48;cursor:not-allowed}
.empty{text-align:center;color:#8496ad;margin:auto}
@media(max-width:600px){
  .chat-shell{padding:0}
  .chat-card{height:calc(100vh - 58px);min-height:0;border-radius:0;border-left:0;border-right:0}
  .chat-head{padding:14px}
  .avatar{width:44px;height:44px;flex-basis:44px;border-radius:13px}
  .avatar img{width:31px;height:31px}
  .customer{max-width:46%}
  .messages{padding:16px 14px}
  .bubble{max-width:88%}
  .composer{padding:11px}
}
@media(max-width:440px){
  .chat-head{align-items:flex-start}
  .customer{max-width:40%;font-size:10px}
  .support-note{display:none}
  .bubble{max-width:92%}
}
</style><link rel="stylesheet" href="assets/css/utility-ui.css?v=20260925-1"></head><body class="platform-ui"><div class="shell"><header class="top"><a class="back" id="exit-chat" href="index.html#home">← Exit chat</a><span class="brand brand-real-logo"><img class="brand-real-logo-img" src="assets/img/dp-logo-header.png?v=20260925-4" alt="DApps Platform"><span>Customer Support</span></span><a class="link" href="profile.html">Profile</a></header><main class="chat-shell"><section class="chat-card"><div class="chat-head"><div class="support-id"><div class="avatar"><img src="assets/img/dp-logo-header.png?v=20260925-4" alt="DApps Support"></div><div class="support-copy"><strong>DApps Support</strong><div class="online">● Online</div><div class="support-note">General support desk</div></div></div><div id="customer" class="customer"></div></div><div id="messages" class="messages"><div class="empty">Connecting to support…</div></div><div class="composer"><textarea id="text" maxlength="3000" placeholder="Message DApps Support…"></textarea><button id="send" class="send">Send</button></div></section></main></div><script src="assets/js/user-notifications.js?v=20260925-2"></script><script>const API=localStorage.getItem('dapps:apiBase')||'https://dapps-trading-platform-production.up.railway.app',token=localStorage.getItem('dapps:token'),box=document.querySelector('#messages'),text=document.querySelector('#text'),sendBtn=document.querySelector('#send');if(!token)location.href='login.html';const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};let last='',leaving=false,poll=null;const syncSend=()=>{sendBtn.disabled=!text.value.trim()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function render(d){document.querySelector('#customer').innerHTML=d.user?.displayName?`<b>${esc(d.user.displayName)}</b><span>Signed in</span>`:'';const html=d.messages.length?d.messages.map(m=>`<div class="bubble ${m.sender==='user'?'user':'agent'}"><div>${esc(m.message).replace(/\n/g,'<br>')}</div><div class="time">${m.sender==='user'?'You':'DApps Support'} · ${new Date(m.createdAt).toLocaleTimeString('en-US',{timeZone:'America/New_York',timeZoneName:'short',hour:'numeric',minute:'2-digit'})}</div></div>`).join(''):`<div class="bubble agent"><div class="welcome-title">Welcome to DApps Support</div><div>Hello${d.user?.displayName?', '+esc(d.user.displayName):''}. How can we assist you today?</div><div class="time">DApps Support</div></div>`;if(html!==last){const near=box.scrollHeight-box.scrollTop-box.clientHeight<100;box.innerHTML=html;last=html;if(near||d.messages.length<3)box.scrollTop=box.scrollHeight}}async function load(){if(leaving)return;try{const r=await fetch(API+'/api/support/chat',{headers:H}),d=await r.json();if(r.ok&&!leaving){render(d);const m=[...(d.messages||[])].reverse().find(x=>x.sender==='admin');if(m&&d.conversation?.id)window.userMarkNotification?.('support_chat',d.conversation.id,m.createdAt)}}catch{}}async function send(){const message=text.value.trim();if(!message)return;text.value='';sendBtn.disabled=true;try{const r=await fetch(API+'/api/support/chat/messages',{method:'POST',headers:H,body:JSON.stringify({message})});if(!r.ok){const d=await r.json();throw Error(d.error||'Unable to send message')}await load()}catch(e){alert(e.message);text.value=message}finally{syncSend();text.focus()}}function leaveChat(){if(leaving)return;leaving=true;if(poll)clearInterval(poll);try{const ref=document.referrer?new URL(document.referrer):null;if(ref&&ref.origin===location.origin&&ref.href!==location.href&&history.length>1){history.back();return}}catch{}location.href='index.html#home'}document.querySelector('#exit-chat').addEventListener('click',e=>{e.preventDefault();leaveChat()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();leaveChat()}},true);sendBtn.onclick=send;text.addEventListener('input',syncSend);text.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});syncSend();load();poll=setInterval(load,3000);</script></body></html>
