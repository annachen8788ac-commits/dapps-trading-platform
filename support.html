<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support | DApps Platform</title><link rel="stylesheet" href="account.css"></head><body><div class="shell"><header class="top"><a class="back" href="index.html#home">← Back</a><span class="brand">Customer Support</span><a class="link" href="profile.html">Profile</a></header><main class="wrap"><section class="card"><span class="eyebrow">SUPPORT CENTER</span><h1 class="title">How can we help?</h1><p class="muted">Submit a ticket for account, trading, asset, pledge, verification or technical issues.</p><div id="msg" class="notice" style="display:none"></div><div class="field"><label>Category</label><select id="category"><option>Account</option><option>Trading</option><option>Assets</option><option>Pledge</option><option>Verification</option><option>Technical</option><option>Other</option></select></div><div class="field"><label>Subject</label><input id="subject" maxlength="120"></div><div class="field"><label>Message</label><textarea id="message" maxlength="3000"></textarea></div><button id="submit" class="btn">Submit Ticket</button></section><section class="card"><div class="row"><span>Your Tickets</span><strong id="ticket-count">0</strong></div><div id="tickets"><div class="muted" style="padding-top:12px">Sign in to view your support history.</div></div></section></main></div><script>const API=localStorage.getItem('dapps:apiBase')||'http://localhost:3000';const token=localStorage.getItem('dapps:token');const msg=document.querySelector('#msg');function show(t,e=false){msg.style.display='block';msg.className='notice '+(e?'err':'ok');msg.textContent=t}function auth(){return token?{Authorization:'Bearer '+token,'Content-Type':'application/json'}:{'Content-Type':'application/json'}}async function load(){if(!token)return;try{const r=await fetch(API+'/api/support/tickets',{headers:auth()});const d=await r.json();if(!r.ok)throw 0;document.querySelector('#ticket-count').textContent=d.tickets.length;document.querySelector('#tickets').innerHTML=d.tickets.length?d.tickets.map(t=>`<div class="ticket"><strong>${t.subject}</strong><span class="pill">${t.status}</span><div class="muted" style="margin-top:6px">${new Date(t.createdAt).toLocaleString()} · ${t.ticketNo}</div></div>`).join(''):'<div class="muted" style="padding-top:12px">No tickets yet.</div>'}catch{}}document.querySelector('#submit').onclick=async()=>{if(!token){location.href='login.html';return}try{const r=await fetch(API+'/api/support/tickets',{method:'POST',headers:auth(),body:JSON.stringify({category:document.querySelector('#category').value,subject:document.querySelector('#subject').value.trim(),message:document.querySelector('#message').value.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to submit ticket');show('Ticket submitted: '+d.ticket.ticketNo);document.querySelector('#subject').value='';document.querySelector('#message').value='';load()}catch(e){show(e.message,true)}};load();</script></body></html>
