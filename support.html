<!doctype html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Support | DApps Platform</title><link rel="stylesheet" href="account.css"><style>body{background:#07101d}.chat-shell{max-width:760px;margin:auto;padding:16px}.chat-card{height:calc(100vh - 105px);min-height:560px;background:#0d1726;border:1px solid #1f3048;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}.chat-head{padding:16px 18px;border-bottom:1px solid #203047;display:flex;align-items:center;gap:12px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#2864ff;font-weight:800}.online{font-size:12px;color:#62d99b}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}.bubble{max-width:76%;padding:11px 13px;border-radius:15px;line-height:1.45;font-size:14px}.bubble.agent{align-self:flex-start;background:#18263a;border-bottom-left-radius:4px}.bubble.user{align-self:flex-end;background:#315fff;border-bottom-right-radius:4px}.time{font-size:10px;opacity:.62;margin-top:5px}.composer{border-top:1px solid #203047;padding:12px;display:flex;gap:9px}.composer textarea{flex:1;resize:none;min-height:46px;max-height:110px;background:#101d2e;color:#fff;border:1px solid #293c57;border-radius:12px;padding:12px}.send{width:86px;border:0;border-radius:12px;background:#315fff;color:#fff;font-weight:800}.empty{text-align:center;color:#8496ad;margin:auto}.customer{font-size:12px;color:#8ea0b7}@media(max-width:600px){.chat-shell{padding:0}.chat-card{height:calc(100vh - 58px);min-height:0;border-radius:0;border-left:0;border-right:0}.bubble{max-width:86%}}</style></head><body><div class="shell"><header class="top"><a class="back" href="index.html#home">← Back</a><span class="brand">Customer Support</span><a class="link" href="profile.html">Profile</a></header><main class="chat-shell"><section class="chat-card"><div class="chat-head"><div class="avatar">DS</div><div><strong>DApps Support</strong><div class="online">● Support desk</div><div id="customer" class="customer"></div></div></div><div id="messages" class="messages"><div class="empty">Connecting to support…</div></div><div class="composer"><textarea id="text" maxlength="3000" placeholder="Type a message…"></textarea><button id="send" class="send">Send</button></div></section></main></div><script>const API=localStorage.getItem('dapps:apiBase')||'https://dapps-trading-platform-production.up.railway.app',token=localStorage.getItem('dapps:token'),box=document.querySelector('#messages'),text=document.querySelector('#text');if(!token)location.href='login.html';const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};let last='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function render(d){document.querySelector('#customer').textContent=d.user?.displayName?`Signed in as ${d.user.displayName}`:'';const html=d.messages.length?d.messages.map(m=>`<div class="bubble ${m.sender==='user'?'user':'agent'}"><div>${esc(m.message).replace(/\n/g,'<br>')}</div><div class="time">${m.sender==='user'?'You':'DApps Support'} · ${new Date(m.createdAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div></div>`).join(''):`<div class="bubble agent"><div>Hello${d.user?.displayName?', '+esc(d.user.displayName):''}. Welcome to DApps Support. How can we help you today?</div><div class="time">DApps Support</div></div>`;if(html!==last){const near=box.scrollHeight-box.scrollTop-box.clientHeight<100;box.innerHTML=html;last=html;if(near||d.messages.length<3)box.scrollTop=box.scrollHeight}}async function load(){try{const r=await fetch(API+'/api/support/chat',{headers:H}),d=await r.json();if(r.ok)render(d)}catch{}}async function send(){const message=text.value.trim();if(!message)return;text.value='';document.querySelector('#send').disabled=true;try{const r=await fetch(API+'/api/support/chat/messages',{method:'POST',headers:H,body:JSON.stringify({message})});if(!r.ok){const d=await r.json();throw Error(d.error||'Unable to send message')}await load()}catch(e){alert(e.message);text.value=message}finally{document.querySelector('#send').disabled=false;text.focus()}}document.querySelector('#send').onclick=send;text.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});load();setInterval(load,3000);</script></body></html>
