<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>身份审核 | DApps 管理后台</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef3ff;background:#090d16}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17233b 0,#090d16 42%);min-height:100vh}.hidden{display:none!important}button,input,select,textarea{font:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid #1f2a40;background:#0b111b;position:sticky;top:0;z-index:10}.brand{font-weight:800;font-size:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.ghost{background:#182236;color:#dbe5f7}.primary{background:#315cff;color:#fff}.main{padding:22px;max-width:1500px;margin:0 auto}.panel{background:#101725;border:1px solid #202c43;border-radius:16px;padding:18px;margin-bottom:16px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#8fa0bc}.search,select,textarea{background:#0b111d;border:1px solid #283651;color:#fff;border-radius:10px;padding:10px 12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #1d2940;vertical-align:top}th{color:#8fa0bc}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#172239;color:#b7c8e3}.badge.pending{background:#3a2d13;color:#ffd47a}.badge.approved{background:#123325;color:#8bdcb3}.badge.rejected{background:#381921;color:#ff9dad}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.kv{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #1d2940}.kv span{color:#8fa0bc}.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.doc{background:#0b111d;border:1px solid #26334c;border-radius:12px;padding:10px}.doc img{width:100%;height:220px;object-fit:contain;background:#080c14;border-radius:8px}.doc b{display:block;margin-bottom:8px}.review{display:grid;grid-template-columns:1fr 190px auto;gap:10px;align-items:end;margin-top:16px}.review textarea{min-height:74px;resize:vertical;width:100%}.status-control label{display:block;color:#8fa0bc;font-size:12px;margin-bottom:6px}.status-control select{width:100%}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(100%,420px);background:#101725;border:1px solid #25314a;border-radius:20px;padding:24px}.field{margin-top:14px}.field label{display:block;color:#9eb0cd;font-size:13px;margin-bottom:7px}.field input{width:100%;background:#0b111d;border:1px solid #26334c;color:#fff;border-radius:10px;padding:12px}.error{color:#ff9bab;font-size:13px;margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}.docs{grid-template-columns:1fr}.review{grid-template-columns:1fr}.table-wrap{overflow:auto}.main{padding:14px}.doc img{height:auto;max-height:360px}}
</style></head><body>
<section id="loginView" class="login hidden"><div class="login-card"><div class="brand">DApps 管理后台</div><div class="muted" style="margin-top:6px">登录后处理身份认证。</div><div class="field"><label>邮箱</label><input id="email" type="email"></div><div class="field"><label>密码</label><input id="password" type="password"></div><button id="loginBtn" class="btn ghost" style="width:100%;margin-top:16px">登录</button><div id="loginError" class="error"></div></div></section>
<section id="appView" class="hidden"><header class="top"><div><div class="brand">身份审核</div><div class="muted" id="adminMeta">身份认证审核队列</div></div><div class="actions"><button class="btn ghost" onclick="location.href='/'">管理首页</button><button class="btn ghost" onclick="location.href='/wallet'">资金管理</button><button id="logoutBtn" class="btn ghost">退出登录</button></div></header><main class="main">
<div class="panel"><div class="bar"><div><b>身份认证申请</b><div class="muted" style="margin-top:4px">状态可直接修改为待审核、已通过或已拒绝，保存后客户端立即读取最新状态。</div></div><div class="actions"><select id="statusFilter"><option value="">全部状态</option><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已拒绝</option></select><button id="refreshBtn" class="btn ghost">刷新</button></div></div><div class="table-wrap"><table><thead><tr><th>用户</th><th>法定姓名</th><th>国家/地区</th><th>证件</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="queueBody"></tbody></table></div></div>
<div id="detailPanel" class="panel hidden"><div class="bar"><div><b id="detailTitle">认证详情</b><div class="muted" id="detailSub"></div></div><span id="detailStatus" class="badge"></span></div><div class="grid" style="margin-top:14px"><div id="identityInfo"></div><div id="accountInfo"></div></div><div class="docs" style="margin-top:16px"><div class="doc"><b>证件正面</b><img id="frontImg" alt="证件正面"></div><div class="doc"><b>证件背面</b><img id="backImg" alt="证件背面"><div id="noBack" class="muted hidden">无需提交 / 未提交</div></div><div class="doc"><b>自拍照</b><img id="selfieImg" alt="自拍照"></div></div><div class="review"><div><div class="muted" style="margin-bottom:6px">审核备注</div><textarea id="reviewNote" placeholder="通过可留空；拒绝建议填写原因"></textarea></div><div class="status-control"><label>审核状态</label><select id="reviewStatus"><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已拒绝</option></select></div><button id="saveStatusBtn" class="btn primary">保存状态</button></div></div>
</main></section>
<script>
const $=s=>document.querySelector(s);let currentId=null;
async function raw(path,options={}){const r=await fetch(path,{cache:'no-store',headers:{'content-type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));return {r,d};}
async function api(path,options={}){const {r,d}=await raw('/admin-api'+path,options);if(r.status===401){showLogin();throw new Error('登录已过期');}if(!r.ok)throw new Error(d.error||'请求失败');return d;}
function showLogin(){$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');}
function showApp(admin){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#adminMeta').textContent=`${admin.displayName} · ${admin.role}`;loadQueue();}
$('#loginBtn').onclick=async()=>{try{const {r,d}=await raw('/session/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});if(!r.ok)throw new Error(d.error||'登录失败');showApp(d.admin);}catch(e){$('#loginError').textContent=e.message;}};
$('#logoutBtn').onclick=async()=>{await fetch('/session/logout',{method:'POST'});showLogin();};
$('#statusFilter').onchange=loadQueue;$('#refreshBtn').onclick=loadQueue;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function dt(v){return v?new Date(v).toLocaleString():'—';}function zhStatus(s){return s==='approved'?'已通过':s==='rejected'?'已拒绝':s==='pending'?'待审核':s;}
async function loadQueue(){try{const status=$('#statusFilter').value;const d=await api('/kyc'+(status?'?status='+encodeURIComponent(status):''));$('#queueBody').innerHTML=d.items.map(x=>`<tr><td><b>${esc(x.user.publicId)}</b><br><span class="muted">${esc(x.user.displayName)}</span></td><td>${esc(x.fullName)}</td><td>${esc(x.country)}</td><td>${esc(String(x.documentType).replaceAll('_',' '))}<br><span class="muted">${esc(x.documentNumber)}</span></td><td><span class="badge ${esc(x.status)}">${zhStatus(x.status)}</span></td><td>${dt(x.submittedAt)}</td><td><button class="btn ghost" onclick="openKyc('${x.id}')">查看/修改</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted">暂无身份认证申请</td></tr>';}catch(e){alert(e.message)}}
window.openKyc=async id=>{try{const d=await api('/kyc/'+id);const x=d.item;currentId=id;$('#detailPanel').classList.remove('hidden');$('#detailTitle').textContent=x.fullName;$('#detailSub').textContent=`${x.user.publicId} · ${x.user.displayName}`;$('#detailStatus').textContent=zhStatus(x.status);$('#detailStatus').className='badge '+x.status;$('#reviewStatus').value=x.status;$('#identityInfo').innerHTML=`<div class="kv"><span>法定姓名</span><b>${esc(x.fullName)}</b></div><div class="kv"><span>出生日期</span><b>${esc(String(x.dateOfBirth).slice(0,10))}</b></div><div class="kv"><span>国家/地区</span><b>${esc(x.country)}</b></div><div class="kv"><span>证件</span><b>${esc(String(x.documentType).replaceAll('_',' '))}</b></div><div class="kv"><span>证件号码</span><b>${esc(x.documentNumber)}</b></div>`;$('#accountInfo').innerHTML=`<div class="kv"><span>账户ID</span><b>${esc(x.user.publicId)}</b></div><div class="kv"><span>显示名称</span><b>${esc(x.user.displayName)}</b></div><div class="kv"><span>登录账号</span><b>${esc(x.user.identifier)}</b></div><div class="kv"><span>提交时间</span><b>${dt(x.submittedAt)}</b></div><div class="kv"><span>审核时间</span><b>${dt(x.reviewedAt)}</b></div>`;$('#frontImg').src=x.documentFront||'';$('#selfieImg').src=x.selfieImage||'';if(x.documentBack){$('#backImg').src=x.documentBack;$('#backImg').classList.remove('hidden');$('#noBack').classList.add('hidden')}else{$('#backImg').src='';$('#backImg').classList.add('hidden');$('#noBack').classList.remove('hidden')}$('#reviewNote').value=x.reviewNote||'';$('#detailPanel').scrollIntoView({behavior:'smooth',block:'start'});}catch(e){alert(e.message)}};
$('#saveStatusBtn').onclick=async()=>{if(!currentId)return;const status=$('#reviewStatus').value,note=$('#reviewNote').value.trim();if(status==='rejected'&&!note&&!confirm('未填写拒绝原因，仍然保存为已拒绝？'))return;if(!confirm(`确认将状态改为“${zhStatus(status)}”？`))return;try{const d=await api('/kyc/'+currentId+'/review',{method:'POST',body:JSON.stringify({status,note})});$('#detailStatus').textContent=zhStatus(d.status);$('#detailStatus').className='badge '+d.status;await loadQueue();await openKyc(currentId);alert('状态已更新。');}catch(e){alert(e.message)}};
window.addEventListener('focus',()=>{loadQueue();if(currentId)openKyc(currentId)});
setInterval(()=>{if(!document.hidden){loadQueue();if(currentId)openKyc(currentId)}},15000);
(async()=>{try{const {r,d}=await raw('/session/me');if(!r.ok)throw 0;showApp(d.admin);}catch{showLogin();}})();
</script></body></html>
