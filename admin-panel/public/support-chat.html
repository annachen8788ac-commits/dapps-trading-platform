<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在线客服 | DApps 管理后台</title><style>:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#eef3ff;background:#090d16}*{box-sizing:border-box}body{margin:0;background:#090d16}.top{height:62px;padding:0 20px;border-bottom:1px solid #202c43;display:flex;align-items:center;justify-content:space-between}.top a{color:#b5c5dc;text-decoration:none}.layout{height:calc(100vh - 62px);display:grid;grid-template-columns:340px 1fr}.list{border-right:1px solid #202c43;overflow:auto}.list-head{padding:16px;border-bottom:1px solid #202c43}.item{padding:14px 16px;border-bottom:1px solid #17243a;cursor:pointer}.item:hover,.item.active{background:#121f32}.name{font-weight:800}.meta,.preview{font-size:12px;color:#899bb3;margin-top:4px}.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{display:flex;flex-direction:column;min-width:0}.chat-head{padding:14px 18px;border-bottom:1px solid #202c43}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:70%;padding:10px 13px;border-radius:14px;line-height:1.5}.bubble.user{align-self:flex-start;background:#17263b}.bubble.admin{align-self:flex-end;background:#315fff}.time{font-size:10px;opacity:.6;margin-top:4px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #202c43}.composer textarea{flex:1;background:#101a2a;border:1px solid #293951;color:#fff;border-radius:10px;padding:11px;resize:none}.btn{border:0;border-radius:9px;padding:10px 16px;background:#315fff;color:#fff;font-weight:800;cursor:pointer}.empty{margin:auto;color:#8394aa}@media(max-width:760px){.layout{grid-template-columns:1fr}.list{display:none}.layout.pick .list{display:block}.layout.pick .chat{display:none}}</style></head><body><header class="top"><strong>DApps 管理后台 · 在线客服</strong><div><a href="/">← 管理首页</a></div></header><main id="layout" class="layout pick"><aside class="list"><div class="list-head"><strong>客户会话</strong><div class="meta">显示客户注册名称和账户 ID</div></div><div id="list"></div></aside><section class="chat"><div class="chat-head"><strong id="chatName">请选择客户</strong><div id="chatMeta" class="meta"></div></div><div id="messages" class="messages"><div class="empty">从左侧选择一个客户开始聊天</div></div><div class="composer"><textarea id="text" rows="2" maxlength="3000" placeholder="输入回复内容…"></textarea><button id="send" class="btn">发送</button></div></section></main><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let current=null;async function api(path,o={}){const r=await fetch('/admin-api'+path,{headers:{'content-type':'application/json',...(o.headers||{})},...o}),d=await r.json().catch(()=>({}));if(r.status===401){location.href='/';throw Error('登录已过期')}if(!r.ok)throw Error(d.error||'请求失败');return d}async function loadList(){try{const d=await api('/support/chats');$('#list').innerHTML=d.chats.map(x=>`<div class="item ${x.id===current?'active':''}" onclick="openChat('${x.id}')"><div class="name">${esc(x.user.displayName||'未设置名称')}</div><div class="meta">${esc(x.user.publicId)} · ${esc(x.user.identifier)}</div><div class="preview">${esc(x.lastMessage||'暂无消息')}</div></div>`).join('')||'<div class="empty" style="padding:30px">暂无客户会话</div>'}catch(e){alert(e.message)}}window.openChat=async id=>{current=id;$('#layout').classList.remove('pick');await loadChat();loadList()};async function loadChat(){if(!current)return;try{const d=await api('/support/chats/'+current),u=d.chat.user;$('#chatName').textContent=u.displayName||'未设置名称';$('#chatMeta').textContent=`账户 ID：${u.publicId} · 登录标识：${u.identifier}`;$('#messages').innerHTML=d.messages.map(m=>`<div class="bubble ${m.sender}"><div>${esc(m.message).replace(/\n/g,'<br>')}</div><div class="time">${m.sender==='admin'?'客服':'客户'} · ${new Date(m.createdAt).toLocaleString('zh-CN',{hour12:false})}</div></div>`).join('')||'<div class="empty">暂无消息</div>';$('#messages').scrollTop=$('#messages').scrollHeight}catch(e){alert(e.message)}}async function send(){if(!current)return alert('请先选择客户');const message=$('#text').value.trim();if(!message)return;$('#text').value='';try{await api('/support/chats/'+current+'/messages',{method:'POST',body:JSON.stringify({message})});await loadChat();loadList()}catch(e){alert(e.message)}}$('#send').onclick=send;$('#text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};(async()=>{try{await api('/me');loadList();setInterval(()=>{loadList();if(current)loadChat()},3000)}catch{location.href='/'}})();</script></body></html>
