<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交易控制 | DApps 管理后台</title><style>:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#eef3ff;background:#090d16}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17233b 0,#090d16 42%);min-height:100vh}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid #1f2a40;background:#0b111b;position:sticky;top:0}.brand{font-weight:800;font-size:20px}.muted{color:#8fa0bc}.main{padding:22px}.panel{background:#101725;border:1px solid #202c43;border-radius:16px;padding:18px}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.btn,input,select{font:inherit}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}.ghost{background:#182236;color:#dbe5f7}.win{background:#143726;color:#84e7af}.loss{background:#3a1920;color:#ffabb8}.auto{background:#1c2740;color:#b9ccff}.search,select{background:#0b111d;border:1px solid #283651;color:#fff;border-radius:10px;padding:10px 12px}.search{width:min(280px,100%)}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #1d2940;vertical-align:top}th{color:#8fa0bc}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#172239}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(100%,420px);background:#101725;border:1px solid #25314a;border-radius:20px;padding:24px}.field{margin-top:14px}.field label{display:block;color:#9eb0cd;font-size:13px;margin-bottom:7px}.field input{width:100%;background:#0b111d;border:1px solid #26334c;color:#fff;border-radius:10px;padding:12px}@media(max-width:900px){.table-wrap{overflow:auto}.main{padding:14px}}</style></head><body><section id="loginView" class="login hidden"><div class="login-card"><div class="brand">DApps Platform 管理后台</div><div class="muted">登录后管理全部注册账户的交易。</div><div class="field"><label>管理员邮箱</label><input id="email" type="email"></div><div class="field"><label>密码</label><input id="password" type="password"></div><button id="loginBtn" class="btn ghost" style="width:100%;margin-top:16px">登录</button><div id="loginError" style="color:#ff9bab;margin-top:10px"></div></div></section><section id="appView" class="hidden"><header class="top"><div><div class="brand">交易控制</div><div class="muted" id="adminMeta">账户交易管理</div></div><div class="row-actions"><button class="btn ghost" onclick="location.href='/'">管理首页</button><button class="btn ghost" onclick="location.href='/wallet'">资金管理</button><button class="btn ghost" onclick="location.href='/kyc'">身份审核</button><button id="logoutBtn" class="btn ghost">退出登录</button></div></header><main class="main"><div class="panel"><div class="bar"><div><b>全部注册账户交易</b><div class="muted" style="margin-top:4px">待结算的内部账户交易可在到期前设置为自动、赢或输。每次人工设置都会记录到审计日志。</div></div><div class="row-actions"><input id="search" class="search" placeholder="搜索交易单、用户或交易对"><select id="result"><option value="">全部结果</option><option value="pending">待结算</option><option value="won">赢</option><option value="lost">输</option></select><button id="refresh" class="btn ghost">刷新</button></div></div><div class="table-wrap"><table><thead><tr><th>交易单</th><th>用户</th><th>交易对</th><th>方向</th><th>金额</th><th>时长</th><th>控制方式</th><th>结果</th><th>到期时间</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div></div></main></section><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),dt=v=>v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'—';const statusMap={pending:'待结算',won:'赢',lost:'输',auto:'自动',win:'赢',loss:'输',up:'看涨',down:'看跌'};const zh=v=>statusMap[v]||v;async function raw(path,o={}){const r=await fetch(path,{headers:{'content-type':'application/json',...(o.headers||{})},...o}),d=await r.json().catch(()=>({}));return{r,d}}async function api(path,o={}){const{r,d}=await raw('/admin-api'+path,o);if(r.status===401){showLogin();throw Error('登录已过期')}if(!r.ok)throw Error(d.error||'请求失败');return d}function showLogin(){$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden')}function showApp(a){const qp=new URLSearchParams(location.search);if(qp.get('search'))$('#search').value=qp.get('search');$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#adminMeta').textContent=`${a.displayName} · ${a.role}`;load()}$('#loginBtn').onclick=async()=>{try{const{r,d}=await raw('/session/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});if(!r.ok)throw Error(d.error||'登录失败');showApp(d.admin)}catch(e){$('#loginError').textContent=e.message}};$('#logoutBtn').onclick=async()=>{await fetch('/session/logout',{method:'POST'});showLogin()};async function load(){try{const q=new URLSearchParams();if($('#result').value)q.set('result',$('#result').value);if($('#search').value.trim())q.set('search',$('#search').value.trim());const d=await api('/trades?'+q.toString());$('#body').innerHTML=d.trades.map(t=>`<tr><td><b>${esc(t.tradeNo)}</b><br><span class="muted">${dt(t.openedAt)}</span></td><td>${esc(t.user.publicId)}<br><span class="muted">${esc(t.user.displayName)}</span></td><td>${esc(t.symbol)}<br><span class="muted">${Number(t.entryPrice).toLocaleString()}</span></td><td>${esc(zh(t.direction))}</td><td>${Number(t.amount).toLocaleString()} USDT</td><td>${t.duration}秒</td><td><span class="badge">${esc(zh(t.resultControl))}</span>${t.overrideNote?`<br><span class="muted">${esc(t.overrideNote)}</span>`:''}</td><td><span class="badge">${esc(zh(t.result))}</span></td><td>${dt(t.expiresAt)}</td><td>${t.result==='pending'?`<div class="row-actions"><button class="btn auto" onclick="control('${t.tradeNo}','auto')">自动</button><button class="btn win" onclick="control('${t.tradeNo}','win')">设为赢</button><button class="btn loss" onclick="control('${t.tradeNo}','loss')">设为输</button></div>`:'—'}</td></tr>`).join('')||'<tr><td colspan="10" class="muted">暂无交易记录</td></tr>'}catch(e){alert(e.message)}}window.control=async(no,c)=>{let note='';if(c!=='auto'){note=prompt(`请输入将 ${no} 强制设置为“${zh(c)}”的原因：`)||'';if(!note.trim())return}if(!confirm(`确认将交易 ${no} 设置为“${zh(c)}”吗？`))return;try{await api('/trades/'+encodeURIComponent(no)+'/control',{method:'PATCH',body:JSON.stringify({control:c,note})});load()}catch(e){alert(e.message)}};$('#refresh').onclick=load;$('#result').onchange=load;let timer;$('#search').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};(async()=>{try{const{r,d}=await raw('/session/me');if(!r.ok)throw 0;showApp(d.admin)}catch{showLogin()}})();</script></body></html>
