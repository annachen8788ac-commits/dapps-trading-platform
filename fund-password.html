<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fund Password | DApps Platform</title><link rel="icon" type="image/png" sizes="64x64" href="favicon.png"><link rel="stylesheet" href="assets/css/account.css"><link rel="stylesheet" href="assets/css/utility-ui.css?v=20260925-2"></head><body class="platform-ui"><div class="shell"><header class="top"><a class="back" href="profile.html">← Account</a><span class="brand brand-real-logo"><img class="brand-real-logo-img" src="assets/img/dp-logo-header.png?v=20260925-4" alt="DApps Platform"><span>Security</span></span><a class="link" href="support.html">Support</a></header><main class="wrap"><section class="card"><span class="eyebrow">ACCOUNT SECURITY</span><h1 class="title">Fund Password</h1><p class="muted">Set a separate 6-digit password required for every withdrawal.</p><div id="msg" class="notice" style="display:none"></div><div id="securityFields" style="visibility:hidden"><div id="setFields"><div class="field"><label>Login Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Confirm your sign-in password"></div></div><div id="changeFields" style="display:none"><div class="field"><label>Current Fund Password</label><input id="currentFundPassword" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Current 6-digit fund password"></div></div><div class="field"><label>New Fund Password</label><input id="newFundPassword" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="6 digits"></div><div class="field"><label>Confirm Fund Password</label><input id="confirmFundPassword" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Repeat 6 digits"></div><button id="save" class="btn">Enable Fund Password</button></div><p class="muted" style="margin-top:12px">After 5 incorrect withdrawal attempts, fund-password verification is locked for 30 minutes. If you forget it, contact support for account recovery.</p></section></main></div><script>
const API=localStorage.getItem('dapps:apiBase')||'https://dapps-trading-platform-production.up.railway.app',token=localStorage.getItem('dapps:token');if(!token)location.href='login.html';
const $=s=>document.querySelector(s);let enabled=false;const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
function show(t,e=false){const m=$('#msg');m.style.display='block';m.className='notice '+(e?'err':'ok');m.textContent=t}
async function api(path,opt={}){const r=await fetch(API+path,{...opt,cache:'no-store',headers:{...H,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401&&path==='/api/security/fund-password'&&String(opt.method||'GET').toUpperCase()==='GET'){localStorage.removeItem('dapps:token');location.href='login.html';throw Error('Session expired')}if(!r.ok)throw Error(d.error||'Request failed');return d}
function paint(){$('#setFields').style.display=enabled?'none':'block';$('#changeFields').style.display=enabled?'block':'none';$('#save').textContent=enabled?'Change Fund Password':'Enable Fund Password';$('#securityFields').style.visibility='visible'}
async function load(){try{const d=await api('/api/security/fund-password');enabled=Boolean(d.enabled);paint();if(d.lockedUntil&&new Date(d.lockedUntil)>new Date())show('Fund password verification is temporarily locked.',true)}catch(e){show(e.message,true)}}
$('#save').onclick=async()=>{const next=$('#newFundPassword').value.trim(),confirm=$('#confirmFundPassword').value.trim();if(!/^\d{6}$/.test(next))return show('Fund password must be exactly 6 digits.',true);if(next!==confirm)return show('Fund passwords do not match.',true);const body=enabled?{currentFundPassword:$('#currentFundPassword').value.trim(),newFundPassword:next}:{currentLoginPassword:$('#loginPassword').value,newFundPassword:next};$('#save').disabled=true;try{const d=await api('/api/security/fund-password',{method:'PUT',body:JSON.stringify(body)});show(d.message||'Fund password saved.');enabled=true;$('#loginPassword').value='';$('#currentFundPassword').value='';$('#newFundPassword').value='';$('#confirmFundPassword').value='';paint()}catch(e){show(e.message,true)}finally{$('#save').disabled=false}};
load();
</script></body></html>
