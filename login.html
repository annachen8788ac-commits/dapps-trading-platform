<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In | DApps Platform</title><link rel="stylesheet" href="account.css"></head><body><div class="shell"><header class="top"><a class="back" href="index.html#home">← Back</a><span class="brand">DApps Platform</span><span></span></header><main class="wrap"><section class="card"><span class="eyebrow">ACCOUNT ACCESS</span><h1 class="title">Sign In</h1><p class="muted">Use your email or mobile number and password.</p><div id="msg" class="notice" style="display:none"></div><div class="field"><label>Email or Mobile</label><input id="identifier" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="login" class="btn">Sign In</button><div class="foot">No account? <a href="register.html">Create one</a></div></section></main></div><script>const API=localStorage.getItem('dapps:apiBase')||'http://localhost:3000';const msg=document.querySelector('#msg');function show(t,e=false){msg.style.display='block';msg.className='notice '+(e?'err':'ok');msg.textContent=t}document.querySelector('#login').onclick=async()=>{try{const r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:document.querySelector('#identifier').value.trim(),password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Sign in failed');localStorage.setItem('dapps:token',d.token);localStorage.setItem('dapps:user',JSON.stringify(d.user));show('Signed in successfully.');setTimeout(()=>location.href='profile.html',400)}catch(e){show(e.message,true)}};</script></body></html>
