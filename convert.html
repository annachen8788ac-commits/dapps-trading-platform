<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convert Assets | DApps Platform</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#07111f;--panel:#0d1a2a;--line:#20354b;--text:#f4f7fb;--muted:#8fa2b7;--green:#13d89c}*{box-sizing:border-box}body{margin:0;background:#050b13;color:var(--text);font-family:Inter,system-ui,sans-serif}.shell{max-width:760px;margin:0 auto;min-height:100vh;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.back{color:#9cb0c5;text-decoration:none}.panel{background:linear-gradient(180deg,#0d1b2c,#091521);border:1px solid var(--line);border-radius:18px;padding:20px}.eyebrow{font-size:11px;letter-spacing:.14em;color:#57b5ff;font-weight:800}.title{font-size:30px;margin:7px 0 4px}.sub{color:var(--muted);font-size:13px}.swap{display:grid;gap:14px;margin-top:22px}.box{border:1px solid var(--line);border-radius:14px;padding:14px;background:#0a1523}.box label{display:block;color:var(--muted);font-size:11px;margin-bottom:8px}.row{display:grid;grid-template-columns:140px 1fr;gap:10px}.row select,.row input{width:100%;border:0;background:#101f31;color:#fff;border-radius:10px;padding:13px;outline:none}.balance{margin-top:8px;font-size:11px;color:var(--muted)}.switch{justify-self:center;border:1px solid var(--line);background:#102238;color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px}.quote{margin:18px 0;padding:14px;border:1px solid var(--line);border-radius:12px;background:#091522}.quote>div{display:flex;justify-content:space-between;margin:8px 0;font-size:13px}.quote span{color:var(--muted)}.convert{width:100%;border:0;border-radius:12px;padding:14px;background:linear-gradient(135deg,#19dca3,#1cbef3);font-weight:800;color:#04110d}.convert:disabled{opacity:.45}.msg{margin-top:12px;font-size:12px;min-height:18px}.history{margin-top:18px}.history h3{font-size:15px}.history-row{display:grid;grid-template-columns:1.4fr 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px}.history-row small{color:var(--muted)}@media(max-width:600px){.shell{padding:14px}.row{grid-template-columns:110px 1fr}.title{font-size:25px}}</style></head><body><div class="shell"><div class="top"><a class="back" href="index.html#assets">← Assets</a><strong>DApps Platform</strong></div><div class="panel"><span class="eyebrow">INTERNAL CONVERT</span><h1 class="title">Convert Assets</h1><p class="sub">Convert one asset in your platform balance into another at the current market reference rate.</p><div class="swap"><div class="box"><label>From</label><div class="row"><select id="from"></select><input id="amount" type="number" min="0" step="any" placeholder="0.00"></div><div class="balance" id="from-balance">Available: 0</div></div><button class="switch" id="switch">⇅</button><div class="box"><label>To</label><div class="row"><select id="to"></select><input id="receive" type="text" readonly placeholder="0.00"></div><div class="balance" id="to-balance">Available: 0</div></div></div><div class="quote"><div><span>Rate</span><strong id="rate">—</strong></div><div><span>You receive</span><strong id="receive-label">—</strong></div><div><span>Fee</span><strong>0</strong></div></div><button class="convert" id="convert" disabled>Convert Now</button><div class="msg" id="msg"></div></div><div class="panel history"><h3>Recent Conversions</h3><div id="history"></div></div></div><script>const API=localStorage.getItem('dapps:apiBase')||'https://dapps-trading-platform-production.up.railway.app';const token=localStorage.getItem('dapps:token');if(!token)location.href='login.html';const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};let assets=[],quote=null;const common=['USDT','BTC','ETH','SOL','BNB','XRP','DOGE','ADA','TRX','LTC','USDC'];const $=id=>document.getElementById(id);function fmt(n,d=8){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:d})}function fill(){const list=[...new Set([...assets.map(a=>a.asset),...common])];$('from').innerHTML=list.map(x=>`<option>${x}</option>`).join('');$('to').innerHTML=list.map(x=>`<option>${x}</option>`).join('');$('from').value=assets.find(a=>a.available>0)?.asset||'USDT';$('to').value=$('from').value==='BTC'?'ETH':'BTC';balanceText();quoteNow()}function bal(code){return assets.find(a=>a.asset===code)?.available||0}function balanceText(){$('from-balance').textContent=`Available: ${fmt(bal($('from').value))} ${$('from').value}`;$('to-balance').textContent=`Available: ${fmt(bal($('to').value))} ${$('to').value}`}let timer;async function quoteNow(){clearTimeout(timer);quote=null;$('convert').disabled=true;$('receive').value='';$('rate').textContent='—';$('receive-label').textContent='—';balanceText();const amount=Number($('amount').value),from=$('from').value,to=$('to').value;if(!amount||amount<=0||from===to)return;timer=setTimeout(async()=>{try{const r=await fetch(`${API}/api/convert/quote?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&amount=${amount}`,{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to quote');quote=d.quote;$('receive').value=fmt(quote.receive,12);$('receive-label').textContent=`${fmt(quote.receive,12)} ${to}`;$('rate').textContent=`1 ${from} ≈ ${fmt(quote.fromPriceUsd/quote.toPriceUsd,12)} ${to}`;$('convert').disabled=amount>bal(from)}catch(e){$('msg').textContent=e.message}},250)}async function load(){try{const r=await fetch(API+'/api/assets',{headers:{Authorization:'Bearer '+token}});const d=await r.json();assets=d.assets||[];fill();history()}catch(e){$('msg').textContent='Unable to load balances.'}}async function history(){try{const r=await fetch(API+'/api/convert/history',{headers:{Authorization:'Bearer '+token}});const d=await r.json();$('history').innerHTML=(d.items||[]).length?(d.items||[]).map(x=>`<div class="history-row"><div><strong>${x.from} → ${x.to}</strong><small>${new Date(x.createdAt).toLocaleString()}</small></div><div>${fmt(x.amount)} ${x.from}<br><small>→ ${fmt(x.receive)} ${x.to}</small></div><strong>${x.status}</strong></div>`).join(''):'<div class="sub">No conversions yet.</div>'}catch{}}$('amount').addEventListener('input',quoteNow);$('from').addEventListener('change',quoteNow);$('to').addEventListener('change',quoteNow);$('switch').onclick=()=>{const a=$('from').value;$('from').value=$('to').value;$('to').value=a;quoteNow()};$('convert').onclick=async()=>{if(!quote)return;const from=$('from').value,to=$('to').value,amount=Number($('amount').value);$('convert').disabled=true;$('msg').textContent='Converting…';try{const r=await fetch(API+'/api/convert',{method:'POST',headers,body:JSON.stringify({from,to,amount})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Conversion failed');$('msg').textContent=`Converted ${fmt(amount)} ${from} to ${fmt(d.conversion.receive,12)} ${to}.`;$('amount').value='';await load()}catch(e){$('msg').textContent=e.message;$('convert').disabled=false}};load();</script></body></html>
