<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | DApps Platform</title><link rel="stylesheet" href="account.css"></head><body><div class="shell"><header class="top"><a class="back" href="index.html#home">← Back</a><span class="brand">Profile</span><a class="link" href="support.html">Support</a></header><main class="wrap"><section class="card hero"><div class="avatar" id="avatar">A</div><h1 class="title" id="name">Guest</h1><div class="muted">Account ID</div><div class="id" id="public-id">Not signed in</div></section><section class="card"><div class="row"><span>Registration</span><strong id="registration">—</strong></div><div class="row"><span>Account</span><strong id="identifier">—</strong></div><div class="row"><span>Status</span><strong id="status">Guest</strong></div></section><div class="stack"><a class="btn secondary center" href="deposit.html" style="text-decoration:none">Deposit</a><a class="btn secondary center" href="withdraw.html" style="text-decoration:none">Withdraw</a><a class="btn secondary center" href="support.html" style="text-decoration:none">Customer Support</a><a id="signin" class="btn center" href="login.html" style="text-decoration:none">Sign In</a><button id="logout" class="btn danger" style="display:none">Sign Out</button></div></main></div><script>const API=localStorage.getItem('dapps:apiBase')||'https://dapps-trading-platform-production.up.railway.app';const token=localStorage.getItem('dapps:token');const cached=JSON.parse(localStorage.getItem('dapps:user')||'null');function paint(u){if(!u)return;document.querySelector('#name').textContent=u.displayName||'User';document.querySelector('#avatar').textContent=(u.displayName||'U').slice(0,1).toUpperCase();document.querySelector('#public-id').textContent=u.publicId||'—';document.querySelector('#registration').textContent=u.registrationType||'—';document.querySelector('#identifier').textContent=u.identifierMasked||u.identifier||'—';document.querySelector('#status').textContent=u.status||'Active';document.querySelector('#signin').style.display='none';document.querySelector('#logout').style.display='block'}if(cached)paint(cached);if(token){fetch(API+'/api/me',{headers:{Authorization:'Bearer '+token}}).then(async r=>{if(!r.ok)throw 0;const d=await r.json();localStorage.setItem('dapps:user',JSON.stringify(d.user));paint(d.user)}).catch(()=>{})}document.querySelector('#logout').onclick=()=>{localStorage.removeItem('dapps:token');localStorage.removeItem('dapps:user');location.href='login.html'};</script></body></html>
